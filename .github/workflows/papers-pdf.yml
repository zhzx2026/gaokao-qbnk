name: papers-pdf

on:
  push:
    paths:
      - ".github/workflows/papers-pdf.yml"
      - "latex/**"
      - "scripts/pdf/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live + fonts
        run: |
          exec > >(tee -a /tmp/diag.log) 2>&1
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-science \
            texlive-fonts-recommended texlive-lang-chinese texlive-pictures texlive-plain-generic \
            latexmk texlive-fonts-extra fonts-noto-cjk fonts-liberation fontconfig ghostscript poppler-utils
      - name: Fonts available
        run: |
          {
            fc-list : family | grep -iE "stix|asana|gyre|noto (serif|sans) cjk sc|fandol|liberation serif|latin modern math|kai" | sort -u | head -80
            kpsewhich tabularray.sty tcolorbox.sty pgfplots.sty ctex.sty unicode-math.sty
            tex --version | head -1; xelatex --version | head -1
          } > /tmp/fonts.txt 2>&1
      - name: Clone math sources
        run: git clone --depth 1 https://github.com/DxAThing/Gaokao-Math-Problems-Compilation.git dx && git -C dx rev-parse HEAD > /tmp/dxrev.txt
      - name: Try compile one paper
        run: |
          cd dx
          sed -e 's/{SimSun}/{Noto Serif CJK SC}/; s/SimHei/Noto Sans CJK SC/; s/KaiTi/FandolKai/; s/{Times New Roman}/{TeX Gyre Termes}/' styles.tex > styles_qbnk.tex
          cat > probe.tex <<'TEX'
          \documentclass[12pt, oneside, UTF8]{ctexbook}
          \input{styles_qbnk.tex}
          \showanswerfalse
          \tallpagefalse
          \begin{document}
          \mainmatter
          \input{content/2024/new_gaokao_paper_1.tex}
          \end{document}
          TEX
          sed -i 's/^          //' probe.tex
          ( time latexmk -xelatex -interaction=nonstopmode -halt-on-error probe.tex ) > /tmp/compile.txt 2>&1 || true
          ls -la probe.pdf >> /tmp/compile.txt 2>&1 || true
          grep -n -B2 -A12 "^!" probe.log | head -60 >> /tmp/compile.txt || true
      - name: Emit diagnostics
        if: always()
        run: python3 scripts/pdf/diag.py /tmp/dxrev.txt /tmp/fonts.txt /tmp/compile.txt
